name: Claude Security Review

on:
  push:
    branches:
      - feat/caller-workflows
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review (workflow_dispatch will NOT post inline comments - use only for prompt smoke tests)
        required: true
        type: string

permissions:
  id-token: write
  pull-requests: write
  issues: write
  contents: read

jobs:
  call:
    uses: aws/agentcore-devx-devtools/.github/workflows/test-pr-security-review.yml@458c0a684af0f9e3a013ec05cd23851def4f9cab
    with:
      runner: ubuntu
      pr_number: ${{ inputs.pr_number || format('{0}', github.event.pull_request.number) }}
    secrets: inherit
