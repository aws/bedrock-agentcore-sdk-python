name: Slack Open PRs Notification

on:
  schedule:
    - cron: '0 13 * * *' # 8:00 AM EST / 9:00 AM EDT (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  call:
    uses: aws/agentcore-devx-devtools/.github/workflows/reusable-slack-open-prs-notification.yml@db12e119f4802fc59da3f8e48cc02c43b225d71d
    with:
      runner: ubuntu
    secrets: inherit
