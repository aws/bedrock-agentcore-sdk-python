name: Slack Open PRs Notification

on:
  push:
    branches:
      - feat/caller-workflows
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  call:
    uses: aws/agentcore-devx-devtools/.github/workflows/test-slack-open-prs-notification.yml@458c0a684af0f9e3a013ec05cd23851def4f9cab
    with:
      runner: ubuntu
    secrets: inherit
